[project]
name = "rrm-ai"
version = "0.1.0"
description = "Natural language CLI for RRM status management"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "ruamel.yaml",
    "python-dotenv",
    "rich",
    "prompt-toolkit>=3.0.53",
]

[tool.setuptools]
py-modules = ["rrm_ai", "adapters", "config", "patch", "prompts", "yaml_utils", "memory", "theme", "daily_brief", "auto_today", "render", "session", "repl"]

[project.scripts]
rrm-ai = "rrm_ai:main"

[dependency-groups]
dev = [
    "pytest",
]
